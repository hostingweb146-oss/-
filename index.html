<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Full Screen Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --bg: #090a0f;
      --surface: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--text);
    }

    body {
      margin: 0;
    }

    .viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Ambient glow behind image */
    .ambient-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top App Bar */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(14px, 2dvh, 24px) 20px;
      padding-top: max(clamp(14px, 2dvh, 24px), env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    }

    .counter {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: background 0.2s, transform 0.2s;
    }

    .action-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.2);
    }

    /* Full-Screen Stage */
    main {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      padding: 0;
    }

    .slide-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6));
      animation: fadeIn 0.35s ease-out;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Fallback State */
    img:not([src]) {
      display: none;
    }

    .error-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
    }

    img:not([src]) + .error-fallback {
      display: flex;
    }

    /* Bottom Overlay Details */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: clamp(16px, 3dvh, 32px) 20px;
      padding-bottom: max(clamp(16px, 3dvh, 32px), env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta h1 {
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meta p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="viewer">
    <div class="ambient-glow"></div>


    <main>
      <div class="slide-container" id="slideContainer">
        <img class="slide active" src="1.jpg" alt="Image 1">
        <img class="slide" src="2.jpg" alt="Image 2" >
      </div>
      <div class="error-fallback">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <span>meow</span>
      </div>
    </main>

    
  </div>

  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    let currentIndex = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });
    }

    setInterval(() => {
      currentIndex = (currentIndex + 1) % slides.length;
      showSlide(currentIndex);
    }, 1500);
  </script>

</body>
</html>
